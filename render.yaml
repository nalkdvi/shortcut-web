# 有料サービス用の公開設定。作成前にRenderの料金を確認してください。
services:
  - type: web
    name: shortcut-hub
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    rootDir: shortcut-hub
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/shortcuts
    numInstances: 1
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/shortcuts.db
      - key: TRUST_PROXY_HOPS
        value: "1"
    disk:
      name: shortcut-hub-data
      mountPath: /var/data
      sizeGB: 1
